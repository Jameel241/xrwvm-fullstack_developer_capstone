name: Django Capstone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Django dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django==5.2.18 requests

      - name: Check Django configuration
        working-directory: server
        run: python manage.py check

      - name: Validate Python syntax
        run: python -m compileall -q server/djangoproj server/djangoapp

      - name: Build React frontend
        working-directory: server/frontend
        run: |
          npm install
          npm run build

      - name: Verify React build files
        run: test -f server/frontend/build/index.html
